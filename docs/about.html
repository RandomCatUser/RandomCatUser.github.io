<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Me <3</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  :root {
    --bg: #F8F8F7;
    --fg: #111110;
    --muted: #6B6B6B;
    --card: #FFFFFF;
    --border: #E8E8E6;
    --accent: #111110;

    --status-online: #43B581;
    --status-idle: #FAA61A;
    --status-dnd: #F04747;
    --status-offline: #747F8D;

    --spotify: #1DB954;

    --tint: 17, 17, 16;
  }
  [data-theme="dark"] {
    --bg: #0C0C0C;
    --fg: #F8F8F7;
    --muted: #888888;
    --card: #161616;
    --border: #222222;
    --accent: #F8F8F7;
    --tint: 248, 248, 247;
  }

  * { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--fg);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }

  .back-btn {
    position: relative; display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 1.2rem; border-radius: 8px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border);
    font-weight: 500; font-size: 0.9rem;
    cursor: pointer; overflow: hidden; isolation: isolate;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .back-btn::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: var(--fg); transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .back-btn:hover { color: var(--bg); border-color: var(--fg); }
  .back-btn:hover::before { transform: translateY(0); }
  .back-btn i { transition: transform 0.3s ease; }
  .back-btn:hover i { transform: translateX(-4px); }

  .theme-toggle {
    width: 56px; height: 30px; border-radius: 100px;
    background: var(--bg); border: 1px solid var(--border);
    cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px;
  }
  .theme-toggle .knob {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: var(--fg); top: 3px; left: 3px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2; display: flex; align-items: center; justify-content: center;
    color: var(--bg); font-size: 9px;
  }
  [data-theme="dark"] .theme-toggle .knob { transform: translateX(26px); }
  .theme-toggle i { font-size: 10px; color: var(--muted); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.5rem;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--fg); }

  .social-link {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; border: 1px solid var(--border); color: var(--fg);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .social-link:hover { background: var(--fg); color: var(--bg); }

  .fade-in { opacity: 0; transform: translateY(10px); animation: fadeIn 0.8s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  /* ===== UNIFIED STATUS & ACTIVITY CARD ===== */
  .unified-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.5rem;
    overflow: hidden;
    isolation: isolate;
    box-shadow: 0 4px 24px -8px rgba(0,0,0,0.08);
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
  }
  .unified-card:hover {
    border-color: rgba(var(--tint), 0.3);
    box-shadow: 0 12px 40px -12px rgba(var(--tint), 0.15);
  }

  /* Blurred background tint for Spotify */
  .np-bg {
    position: absolute; inset: -20px; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(48px) saturate(1.6) brightness(1.05);
    opacity: 0; transition: opacity 0.7s ease, background-image 0.4s ease;
    pointer-events: none;
  }
  .unified-card.is-playing .np-bg { opacity: 0.14; }
  [data-theme="dark"] .unified-card.is-playing .np-bg { opacity: 0.22; }
  .np-glass {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(180deg, rgba(var(--tint), 0.02), rgba(var(--tint), 0.05));
    pointer-events: none;
  }

  .status-inner { position: relative; z-index: 1; }
  
  .np-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .np-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; color: var(--fg); font-weight: 500; }
  .np-label .fa-spotify { color: var(--spotify); font-size: 1.1rem; }
  
  .np-status {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8rem; font-weight: 500;
    padding: 0.3rem 0.7rem; border-radius: 100px;
    border: 1px solid var(--border); color: var(--muted);
    background: var(--card); transition: color 0.3s ease, border-color 0.3s ease;
  }
  .np-status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--status-offline); box-shadow: 0 0 0 0 currentColor;
    transition: background 0.3s ease;
  }
  .np-status.is-online { color: var(--status-online); border-color: rgba(67,181,129,0.3); }
  .np-status.is-online .dot { background: var(--status-online); animation: pulse 2.5s ease infinite; }
  .np-status.is-idle { color: var(--status-idle); border-color: rgba(250,166,26,0.3); }
  .np-status.is-idle .dot { background: var(--status-idle); }
  .np-status.is-dnd { color: var(--status-dnd); border-color: rgba(240,71,71,0.3); }
  .np-status.is-dnd .dot { background: var(--status-dnd); }
  .np-status.is-offline { color: var(--muted); }
  .np-status.is-offline .dot { background: var(--status-offline); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; }
    50% { box-shadow: 0 0 0 4px transparent; }
  }

  /* Spotify Body */
  .np-body { display: flex; align-items: center; gap: 1rem; margin-top: 1.25rem; }
  .np-art {
    position: relative; width: 64px; height: 64px; border-radius: 12px;
    overflow: hidden; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border);
  }
  .np-art img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.5s ease; display: block;
  }
  .np-art img.loaded { opacity: 1; }
  .np-art .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.25rem; transition: opacity 0.3s ease;
  }
  .unified-card.is-playing .np-art .placeholder { opacity: 0; }
  .np-eq {
    position: absolute; bottom: 6px; right: 6px;
    display: flex; align-items: flex-end; gap: 2px;
    height: 12px; padding: 3px;
    background: rgba(0,0,0,0.6); border-radius: 6px;
    backdrop-filter: blur(4px);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .unified-card.is-playing .np-eq { opacity: 1; }
  .np-eq span { width: 2px; background: var(--spotify); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .np-eq span:nth-child(1) { animation-delay: 0s; }
  .np-eq span:nth-child(2) { animation-delay: 0.2s; }
  .np-eq span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }
  
  .np-meta { flex: 1; min-width: 0; }
  .np-title {
    font-weight: 600; font-size: 1rem; line-height: 1.3; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.4s ease;
  }
  .np-artist {
    font-size: 0.85rem; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.4s ease;
  }
  .np-progress { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 1rem; }
  .np-bar { position: relative; height: 4px; border-radius: 100px; background: var(--border); overflow: hidden; }
  .np-bar-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: var(--fg); border-radius: 100px;
    transition: width 0.1s linear;
  }
  .unified-card.is-playing .np-bar-fill { background: var(--spotify); }
  .np-times {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--muted);
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .np-fade-out { opacity: 0; transform: translateY(4px); }
  .np-body, .np-progress { transition: opacity 0.35s ease, transform 0.35s ease; }

  /* Divider */
  .card-divider {
    height: 0;
    background: var(--border);
    margin: 0;
    opacity: 0;
    transition: height 0.4s ease, margin 0.4s ease, opacity 0.3s ease;
  }

  /* Activity Wrapper (Hover Expansion) */
  .activity-wrap {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    display: flex;
    flex-direction: column;
    gap: 1.25rem; /* Spacing between separated activities */
    transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
  }
  /* Expand when the status box is hovered or focused */
  .unified-card:hover .activity-wrap,
  .unified-card:focus-within .activity-wrap {
    max-height: 1000px; 
    opacity: 1;
  }
  .unified-card:hover .card-divider,
  .unified-card:focus-within .card-divider {
    height: 1px;
    margin: 1.5rem 0;
    opacity: 1;
  }
  /* Touch device fallback */
  @media (hover: none) {
    .activity-wrap { max-height: 1000px; opacity: 1; }
    .card-divider { height: 1px; margin: 1.5rem 0; opacity: 1; }
  }

  /* ===== ACTIVITY ITEMS ===== */
  .activity-item {
    display: flex; gap: 1rem; align-items: flex-start;
  }
  .activity-img-wrap {
    position: relative; flex-shrink: 0; width: 60px; height: 60px;
  }
  .activity-img {
    width: 60px; height: 60px; border-radius: 12px;
    object-fit: cover; display: block;
    border: 1px solid var(--border); background: var(--bg);
  }
  .activity-img-placeholder {
    width: 60px; height: 60px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.4rem;
  }
  .activity-img-small {
    position: absolute; bottom: -4px; right: -4px;
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--card); background: var(--bg);
  }
  .activity-content { flex: 1; min-width: 0; }
  .activity-type-badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em;
    color: var(--muted); margin-bottom: 0.35rem; text-transform: uppercase;
  }
  .activity-name {
    font-weight: 600; font-size: 1.05rem; line-height: 1.3; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .activity-detail {
    font-size: 0.9rem; color: var(--fg);
    margin-top: 3px; opacity: 0.8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .activity-state {
    font-size: 0.85rem; color: var(--muted);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .activity-time {
    font-size: 0.8rem; color: var(--muted);
    margin-top: 6px; font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: center; gap: 0.3rem;
  }
  .activity-buttons {
    display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem;
  }
  .activity-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8rem; font-weight: 500;
    padding: 0.4rem 0.8rem; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--fg); text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
    cursor: pointer;
  }
  .activity-btn:hover { background: var(--fg); color: var(--bg); }
  .activity-btn .fa-youtube { color: #FF0000; }
  .activity-btn:hover .fa-youtube { color: #FFFFFF; }

  .activity-empty {
    display: flex; align-items: center; gap: 0.75rem;
    color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0;
  }
  .activity-empty i { font-size: 1.3rem; opacity: 0.4; }

  @media (prefers-reduced-motion: reduce) {
    .np-eq span, .np-status.is-online .dot { animation: none !important; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center p-6 md:p-8">
  <button class="back-btn fade-in" onclick="window.location.href='https://randomcatuser.github.io'" aria-label="Back to home">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Back</span>
  </button>

  <div class="theme-toggle fade-in" id="themeToggle" role="button" tabindex="0" aria-label="Toggle dark mode" aria-pressed="false">
    <i class="fa-solid fa-sun"></i>
    <i class="fa-solid fa-moon"></i>
    <div class="knob">
      <i class="fa-solid fa-sun" id="knobIcon"></i>
    </div>
  </div>
</header>

<main class="max-w-2xl mx-auto px-6 py-32 md:py-40">

  <section class="flex flex-col items-center text-center mb-20 fade-in" style="animation-delay: 0.1s;">
    <img src="https://github.com/RandomCatUser/RandomCatUser/blob/main/workflows/MyProfile.webp?raw=true" alt="Avatar" class="w-24 h-24 rounded-full object-cover mb-6 border" style="border-color: var(--border);" />
    <h1 class="serif text-5xl md:text-6xl mb-3 leading-tight">Dihan Ramanayaka</h1>
    <p class="text-base md:text-lg" style="color: var(--muted);">Lord Whiskers 𖹭 | RandomCatUser</p>
  </section>

  <!-- ===== UNIFIED STATUS & ACTIVITY CARD ===== -->
  <section class="mb-16 fade-in" style="animation-delay: 0.2s;" aria-labelledby="np-heading">
    <h2 id="np-heading" class="text-xs uppercase tracking-widest mb-4" style="color: var(--muted);">Status</h2>
    
    <div id="statusWrapper" class="unified-card" role="button" tabindex="0" aria-label="Status and Activity Widget">
      <!-- Blurred Tints -->
      <div class="np-bg" id="npBg" aria-hidden="true"></div>
      <div class="np-glass" aria-hidden="true"></div>

      <div class="status-inner">
        <!-- Header -->
        <div class="np-header">
          <div class="np-label">
            <i class="fa-brands fa-spotify"></i>
            <span id="npLabel">Connecting…</span>
          </div>
          <div class="np-status" id="npStatus" aria-live="polite">
            <span class="dot"></span>
            <span id="npStatusText">Offline</span>
          </div>
        </div>

        <!-- Spotify Body -->
        <div class="np-body" id="npBody" style="display:none;">
          <div class="np-art">
            <div class="placeholder"><i class="fa-solid fa-music"></i></div>
            <img id="npArt" alt="" loading="lazy" />
            <div class="np-eq" aria-hidden="true"><span></span><span></span><span></span></div>
          </div>
          <div class="np-meta">
            <div class="np-title" id="npTitle">—</div>
            <div class="np-artist" id="npArtist">—</div>
          </div>
        </div>

        <!-- Spotify Progress -->
        <div class="np-progress" id="npProgress" style="display:none;">
          <div class="np-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="np-bar-fill" id="npBarFill" style="width:0%"></div>
          </div>
          <div class="np-times">
            <span id="npCurrent">0:00</span>
            <span id="npTotal">0:00</span>
          </div>
        </div>

        <!-- Divider that appears on hover -->
        <div class="card-divider"></div>

        <!-- Hidden Activity Wrapper that expands on hover -->
        <div id="activityWidget" class="activity-wrap" aria-live="polite">
          <div class="activity-empty">
            <i class="fa-solid fa-gamepad"></i>
            <span>Connecting to Discord…</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="mb-16 fade-in" style="animation-delay: 0.3s;">
    <h2 class="text-xs uppercase tracking-widest mb-4" style="color: var(--muted);">Toolbox</h2>
    <div class="grid grid-cols-2 gap-4">
      <div class="card">
        <h3 class="font-medium mb-1">Frontend</h3>
        <p class="text-sm" style="color: var(--muted);">HTML, CSS, JavaScript, React</p>
      </div>
      <div class="card">
        <h3 class="font-medium mb-1">Design</h3>
        <p class="text-sm" style="color: var(--muted);">Figma, UI/UX, Prototyping</p>
      </div>
      <div class="card">
        <h3 class="font-medium mb-1">Backend</h3>
        <p class="text-sm" style="color: var(--muted);">Node.js, Python, APIs</p>
      </div>
      <div class="card">
        <h3 class="font-medium mb-1">Tools</h3>
        <p class="text-sm" style="color: var(--muted);">Git, VS Code, Terminal</p>
      </div>
    </div>
  </section>

  <section class="text-center fade-in" style="animation-delay: 0.4s;">
    <h2 class="text-xs uppercase tracking-widest mb-6" style="color: var(--muted);">Connect</h2>
    <div class="flex justify-center gap-3">
      <a href="https://github.com/randomcatuser" target="_blank" rel="noopener" class="social-link" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="https://discord.gg/1068541705596448788" class="social-link" aria-label="Discord"><i class="fa-brands fa-discord" aria-hidden="true"></i></a>
      <a href="mailto:" class="social-link" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </section>

</main>

<footer class="text-center pb-10 text-sm" style="color: var(--muted);">
  :D
</footer>

<script src="./about.js"></script>

</body>
</html>
