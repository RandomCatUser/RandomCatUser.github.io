<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Me <3</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  :root {
    --bg: #F8F8F7;
    --fg: #111110;
    --muted: #6B6B6B;
    --card: #FFFFFF;
    --border: #E8E8E6;
    --accent: #111110;

    --status-online: #43B581;
    --status-idle: #FAA61A;
    --status-dnd: #F04747;
    --status-offline: #747F8D;

    --spotify: #1DB954;

    --tint: 17, 17, 16;
  }
  [data-theme="dark"] {
    --bg: #0C0C0C;
    --fg: #F8F8F7;
    --muted: #888888;
    --card: #161616;
    --border: #222222;
    --accent: #F8F8F7;
    --tint: 248, 248, 247;
  }

  * { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--fg);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }

  .back-btn {
    position: relative; display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 1.2rem; border-radius: 8px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border);
    font-weight: 500; font-size: 0.9rem;
    cursor: pointer; overflow: hidden; isolation: isolate;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .back-btn::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: var(--fg); transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .back-btn:hover { color: var(--bg); border-color: var(--fg); }
  .back-btn:hover::before { transform: translateY(0); }
  .back-btn i { transition: transform 0.3s ease; }
  .back-btn:hover i { transform: translateX(-4px); }

  .theme-toggle {
    width: 56px; height: 30px; border-radius: 100px;
    background: var(--bg); border: 1px solid var(--border);
    cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px;
  }
  .theme-toggle .knob {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: var(--fg); top: 3px; left: 3px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2; display: flex; align-items: center; justify-content: center;
    color: var(--bg); font-size: 9px;
  }
  [data-theme="dark"] .theme-toggle .knob { transform: translateX(26px); }
  .theme-toggle i { font-size: 10px; color: var(--muted); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.5rem;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--fg); }

  .social-link {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; border: 1px solid var(--border); color: var(--fg);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .social-link:hover { background: var(--fg); color: var(--bg); }

  .fade-in { opacity: 0; transform: translateY(10px); animation: fadeIn 0.8s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  /* ===== UNIFIED STATUS & ACTIVITY CARD ===== */
  .unified-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.5rem;
    overflow: hidden;
    isolation: isolate;
    box-shadow: 0 4px 24px -8px rgba(0,0,0,0.08);
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
  }
  .unified-card:hover {
    border-color: rgba(var(--tint), 0.3);
    box-shadow: 0 12px 40px -12px rgba(var(--tint), 0.15);
  }

  /* Blurred background tint for Spotify */
  .np-bg {
    position: absolute; inset: -20px; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(48px) saturate(1.6) brightness(1.05);
    opacity: 0; transition: opacity 0.7s ease, background-image 0.4s ease;
    pointer-events: none;
  }
  .unified-card.is-playing .np-bg { opacity: 0.14; }
  [data-theme="dark"] .unified-card.is-playing .np-bg { opacity: 0.22; }
  .np-glass {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(180deg, rgba(var(--tint), 0.02), rgba(var(--tint), 0.05));
    pointer-events: none;
  }

  .status-inner { position: relative; z-index: 1; }
  
  .np-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .np-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; color: var(--fg); font-weight: 500; }
  .np-label .fa-spotify { color: var(--spotify); font-size: 1.1rem; }
  
  .np-status {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8rem; font-weight: 500;
    padding: 0.3rem 0.7rem; border-radius: 100px;
    border: 1px solid var(--border); color: var(--muted);
    background: var(--card); transition: color 0.3s ease, border-color 0.3s ease;
  }
  .np-status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--status-offline); box-shadow: 0 0 0 0 currentColor;
    transition: background 0.3s ease;
  }
  .np-status.is-online { color: var(--status-online); border-color: rgba(67,181,129,0.3); }
  .np-status.is-online .dot { background: var(--status-online); animation: pulse 2.5s ease infinite; }
  .np-status.is-idle { color: var(--status-idle); border-color: rgba(250,166,26,0.3); }
  .np-status.is-idle .dot { background: var(--status-idle); }
  .np-status.is-dnd { color: var(--status-dnd); border-color: rgba(240,71,71,0.3); }
  .np-status.is-dnd .dot { background: var(--status-dnd); }
  .np-status.is-offline { color: var(--muted); }
  .np-status.is-offline .dot { background: var(--status-offline); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; }
    50% { box-shadow: 0 0 0 4px transparent; }
  }

  /* Spotify Body */
  .np-body { display: flex; align-items: center; gap: 1rem; margin-top: 1.25rem; }
  .np-art {
    position: relative; width: 64px; height: 64px; border-radius: 12px;
    overflow: hidden; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border);
  }
  .np-art img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.5s ease; display: block;
  }
  .np-art img.loaded { opacity: 1; }
  .np-art .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.25rem; transition: opacity 0.3s ease;
  }
  .unified-card.is-playing .np-art .placeholder { opacity: 0; }
  .np-eq {
    position: absolute; bottom: 6px; right: 6px;
    display: flex; align-items: flex-end; gap: 2px;
    height: 12px; padding: 3px;
    background: rgba(0,0,0,0.6); border-radius: 6px;
    backdrop-filter: blur(4px);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .unified-card.is-playing .np-eq { opacity: 1; }
  .np-eq span { width: 2px; background: var(--spotify); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .np-eq span:nth-child(1) { animation-delay: 0s; }
  .np-eq span:nth-child(2) { animation-delay: 0.2s; }
  .np-eq span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }
  
  .np-meta { flex: 1; min-width: 0; }
  .np-title {
    font-weight: 600; font-size: 1rem; line-height: 1.3; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.4s ease;
  }
  .np-artist {
    font-size: 0.85rem; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.4s ease;
  }
  .np-progress { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 1rem; }
  .np-bar { position: relative; height: 4px; border-radius: 100px; background: var(--border); overflow: hidden; }
  .np-bar-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: var(--fg); border-radius: 100px;
    transition: width 0.1s linear;
  }
  .unified-card.is-playing .np-bar-fill { background: var(--spotify); }
  .np-times {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--muted);
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .np-fade-out { opacity: 0; transform: translateY(4px); }
  .np-body, .np-progress { transition: opacity 0.35s ease, transform 0.35s ease; }

  /* Divider */
  .card-divider {
    height: 0;
    background: var(--border);
    margin: 0;
    opacity: 0;
    transition: height 0.4s ease, margin 0.4s ease, opacity 0.3s ease;
  }

  /* Activity Wrapper (Hover Expansion) */
  .activity-wrap {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    display: flex;
    flex-direction: column;
    gap: 1.25rem; /* Spacing between separated activities */
    transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
  }
  /* Expand when the status box is hovered or focused */
  .unified-card:hover .activity-wrap,
  .unified-card:focus-within .activity-wrap {
    max-height: 1000px; 
    opacity: 1;
  }
  .unified-card:hover .card-divider,
  .unified-card:focus-within .card-divider {
    height: 1px;
    margin: 1.5rem 0;
    opacity: 1;
  }
  /* Touch device fallback */
  @media (hover: none) {
    .activity-wrap { max-height: 1000px; opacity: 1; }
    .card-divider { height: 1px; margin: 1.5rem 0; opacity: 1; }
  }

  /* ===== ACTIVITY ITEMS ===== */
  .activity-item {
    display: flex; gap: 1rem; align-items: flex-start;
  }
  .activity-img-wrap {
    position: relative; flex-shrink: 0; width: 60px; height: 60px;
  }
  .activity-img {
    width: 60px; height: 60px; border-radius: 12px;
    object-fit: cover; display: block;
    border: 1px solid var(--border); background: var(--bg);
  }
  .activity-img-placeholder {
    width: 60px; height: 60px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.4rem;
  }
  .activity-img-small {
    position: absolute; bottom: -4px; right: -4px;
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--card); background: var(--bg);
  }
  .activity-content { flex: 1; min-width: 0; }
  .activity-type-badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em;
    color: var(--muted); margin-bottom: 0.35rem; text-transform: uppercase;
  }
  .activity-name {
    font-weight: 600; font-size: 1.05rem; line-height: 1.3; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .activity-detail {
    font-size: 0.9rem; color: var(--fg);
    margin-top: 3px; opacity: 0.8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .activity-state {
    font-size: 0.85rem; color: var(--muted);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .activity-time {
    font-size: 0.8rem; color: var(--muted);
    margin-top: 6px; font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: center; gap: 0.3rem;
  }
  .activity-buttons {
    display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem;
  }
  .activity-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8rem; font-weight: 500;
    padding: 0.4rem 0.8rem; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--fg); text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
    cursor: pointer;
  }
  .activity-btn:hover { background: var(--fg); color: var(--bg); }
  .activity-btn .fa-youtube { color: #FF0000; }
  .activity-btn:hover .fa-youtube { color: #FFFFFF; }

  .activity-empty {
    display: flex; align-items: center; gap: 0.75rem;
    color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0;
  }
  .activity-empty i { font-size: 1.3rem; opacity: 0.4; }

  @media (prefers-reduced-motion: reduce) {
    .np-eq span, .np-status.is-online .dot { animation: none !important; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center p-6 md:p-8">
  <button class="back-btn fade-in" onclick="window.location.href='https://randomcatuser.github.io'" aria-label="Back to home">
    <i class="fa-solid fa-arrow-left"></i>

  <div class="theme-toggle fade-in" id="themeToggle" role="button" tabindex="0" aria-label="Toggle dark mode" aria-pressed="false">

<main class="max-w-2xl mx-auto px-6 py-32 md:py-40">

  <section class="flex flex-col items-center text-center mb-20 fade-in" style="animation-delay: 0.1s;">
    <img src="https://github.com/RandomCatUser/RandomCatUser/blob/main/workflows/MyProfile.webp?raw=true" alt="Avatar" class="w-24 h-24 rounded-full object-cover mb-6 border" style="border-color: var(--border);" />

  <!-- ===== UNIFIED STATUS & ACTIVITY CARD ===== -->
  <section class="mb-16 fade-in" style="animation-delay: 0.2s;" aria-labelledby="np-heading">
    <h2 id="np-heading" class="text-xs uppercase tracking-widest mb-4" style="color: var(--muted);">Status</h2>
    
    <div id="statusWrapper" class="unified-card" role="button" tabindex="0" aria-label="Status and Activity Widget">
      <!-- Blurred Tints -->
      <div class="np-bg" id="npBg" aria-hidden="true"></div>

      <div class="status-inner">

        <!-- Spotify Body -->
        <div class="np-body" id="npBody" style="display:none;">
          <div class="np-art">
            <div class="placeholder"><i class="fa-solid fa-music"></i></div>
            <img id="npArt" alt="" loading="lazy" />

        <!-- Spotify Progress -->
        <div class="np-progress" id="npProgress" style="display:none;">
          <div class="np-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

          </div>

        <!-- Hidden Activity Wrapper that expands on hover -->

  <section class="mb-16 fade-in" style="animation-delay: 0.3s;">

  <section class="text-center fade-in" style="animation-delay: 0.4s;">

      <a href="mailto:" class="social-link" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    </div>

</main>

<script>
  // ---------- Theme Toggle ----------
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const knobIcon = document.getElementById('knobIcon');

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    knobIcon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    themeToggle.setAttribute('aria-pressed', theme === 'dark');
    try { localStorage.setItem('rc-theme', theme); } catch (e) {}
  }
  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem('rc-theme') || 'light'; } catch (e) {}
  applyTheme(savedTheme);
  function toggleTheme() {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  }
  themeToggle.addEventListener('click', toggleTheme);
  themeToggle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
  });

  /* =====================================================================
     LANYARD WIDGET — Spotify + Discord Activities
     ===================================================================== */
  const LanyardWidget = (() => {
    const DISCORD_ID = '1068541705596448788';
    const WS_URL = 'wss://api.lanyard.rest/socket';
    const HTTP_URL = `https://api.lanyard.rest/v1/users/${DISCORD_ID}`;
    const POLL_INTERVAL_MS = 10000;
    const RECONNECT_BASE_MS = 2000;
    const RECONNECT_MAX_MS = 30000;

    const els = {
      widget: document.getElementById('statusWrapper'),
      bg: document.getElementById('npBg'),
      label: document.getElementById('npLabel'),
      status: document.getElementById('npStatus'),
      statusText: document.getElementById('npStatusText'),
      body: document.getElementById('npBody'),
      art: document.getElementById('npArt'),
      title: document.getElementById('npTitle'),
      artist: document.getElementById('npArtist'),
      progress: document.getElementById('npProgress'),
      barFill: document.getElementById('npBarFill'),
      barWrap: () => els.progress.querySelector('[role="progressbar"]'),
      current: document.getElementById('npCurrent'),
      total: document.getElementById('npTotal'),
      activityWrap: document.getElementById('activityWidget'),
    };

    let ws = null;
    let heartbeatTimer = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let pollTimer = null;
    let progressRaf = null;
    let activityTickTimer = null;
    let usingWebSocket = false;
    let lastTrackId = null;
    let currentSpotify = null;
    let currentActivities = []; 

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const formatTime = (ms) => {
      if (!ms || ms < 0) ms = 0;
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    };

    const escapeHtml = (str) => {
      if (str == null) return '';
      return String(str).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    };

    // ---------- DISCORD STATUS ----------
    function updateDiscordStatus(discordStatus) {
      const statusMap = {
        online: { label: 'Online', cls: 'is-online' },
        idle:   { label: 'Idle',    cls: 'is-idle' },
        dnd:    { label: 'Do Not Disturb', cls: 'is-dnd' },
        offline:{ label: 'Offline', cls: 'is-offline' },
      };
      const s = statusMap[discordStatus] || statusMap.offline;
      els.status.classList.remove('is-online', 'is-idle', 'is-dnd', 'is-offline');
      els.status.classList.add(s.cls);
      els.statusText.textContent = s.label;
      els.status.setAttribute('aria-label', `Discord status: ${s.label}`);
    }

    // ---------- SPOTIFY ----------
    function applySpotifyData(spotify) {
      if (!spotify || !spotify.track_id) {
        showEmptyState();
        return;
      }
      if (spotify.track_id === lastTrackId) {
        currentSpotify = {
          trackId: spotify.track_id,
          start: spotify.timestamps?.start || Date.now(),
          end: spotify.timestamps?.end || Date.now(),
          trackUrl: `https://open.spotify.com/track/${spotify.track_id}`,
        };
        return;
      }
      crossfadeTrack(() => renderTrack(spotify));
      lastTrackId = spotify.track_id;
    }

    function renderTrack(spotify) {
      currentSpotify = {
        trackId: spotify.track_id,
        start: spotify.timestamps?.start || Date.now(),
        end: spotify.timestamps?.end || Date.now(),
        trackUrl: `https://open.spotify.com/track/${spotify.track_id}`,
      };

      els.body.style.display = 'flex';
      els.progress.style.display = 'flex';
      els.widget.classList.add('is-playing');

      els.art.classList.remove('loaded');
      els.art.onload = null;
      els.art.onerror = null;
      els.art.onload = () => els.art.classList.add('loaded');
      els.art.onerror = () => els.art.classList.remove('loaded');
      els.art.src = spotify.album_art_url;
      els.art.alt = `${spotify.album} cover`;

      els.title.textContent = spotify.song || 'Unknown track';
      els.artist.textContent = spotify.artist || 'Unknown artist';
      els.bg.style.backgroundImage = `url("${spotify.album_art_url}")`;

      extractDominantColor(spotify.album_art_url).then((rgb) => {
        if (rgb) els.widget.style.setProperty('--tint', rgb);
      });

      els.label.textContent = 'Listening to Spotify';
      startProgress();
    }

    function showEmptyState() {
      stopProgress();
      currentSpotify = null;
      lastTrackId = null;
      els.body.style.display = 'none';
      els.progress.style.display = 'none';
      els.widget.classList.remove('is-playing');
      els.bg.style.backgroundImage = '';
      els.label.textContent = 'Not listening to Spotify';
    }

    function crossfadeTrack(callback) {
      const fadeable = [els.body, els.progress];
      if (reducedMotion) { callback(); return; }
      fadeable.forEach(el => el.classList.add('np-fade-out'));
      setTimeout(() => {
        callback();
        fadeable.forEach(el => el.classList.remove('np-fade-out'));
      }, 220);
    }

    function startProgress() {
      stopProgress();
      if (!currentSpotify) return;
      const tick = () => {
        if (!currentSpotify) return;
        const now = Date.now();
        const { start, end } = currentSpotify;
        const duration = end - start;
        let elapsed = now - start;
        if (elapsed >= duration && duration > 0) elapsed = duration;
        const pct = duration > 0 ? (elapsed / duration) * 100 : 0;
        els.barFill.style.width = `${pct}%`;
        els.current.textContent = formatTime(elapsed);
        els.total.textContent = formatTime(duration);
        const bar = els.barWrap();
        if (bar) {
          bar.setAttribute('aria-valuenow', Math.round(pct));
          bar.setAttribute('aria-label', `${formatTime(elapsed)} of ${formatTime(duration)}`);
        }
        progressRaf = requestAnimationFrame(tick);
      };
      if (reducedMotion) { tick(); progressRaf = setInterval(tick, 1000); }
      else { tick(); }
    }

    function stopProgress() {
      if (progressRaf) {
        if (reducedMotion) clearInterval(progressRaf);
        else cancelAnimationFrame(progressRaf);
        progressRaf = null;
      }
    }

    // ---------- DOMINANT COLOR ----------
    let colorCache = new Map();
    function extractDominantColor(url) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);
        if (colorCache.has(url)) return resolve(colorCache.get(url));
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.referrerPolicy = 'no-referrer';
        img.onload = () => {
          try {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) {
              const a = data[i + 3];
              if (a < 125) continue;
              r += data[i]; g += data[i + 1]; b += data[i + 2]; count++;
            }
            if (count === 0) return resolve(null);
            r = Math.round(r / count);
            g = Math.round(g / count);
            b = Math.round(b / count);
            const rgb = `${r}, ${g}, ${b}`;
            colorCache.set(url, rgb);
            resolve(rgb);
          } catch (e) { resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    function openOnSpotify() {
      if (currentSpotify && currentSpotify.trackUrl) {
        window.open(currentSpotify.trackUrl, '_blank', 'noopener,noreferrer');
      }
    }
    els.widget.addEventListener('click', (e) => {
      // Only trigger if clicking the status area, not the activity buttons
      if (!e.target.closest('.activity-btn')) {
        openOnSpotify();
      }
    });
    els.widget.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { 
        e.preventDefault(); 
        openOnSpotify(); 
      }
    });

    // =================================================================
    //  ACTIVITIES (GAMES / STREAMING / WATCHING...)
    // =================================================================

    const ACTIVITY_TYPES = {
      0: { label: 'Playing',    icon: 'fa-gamepad' },
      1: { label: 'Streaming',  icon: 'fa-tower-broadcast' },
      2: { label: 'Listening',  icon: 'fa-music' },
      3: { label: 'Watching',   icon: 'fa-eye' },
      4: { label: 'Custom',     icon: 'fa-message' },
      5: { label: 'Competing',  icon: 'fa-trophy' },
    };

    function resolveAssetUrl(applicationId, asset) {
      if (!asset) return null;
      if (asset.startsWith('mp:external/')) {
        return 'https://media.discordapp.net/external/' + asset.slice('mp:external/'.length);
      }
      if (asset.startsWith('mp:')) {
        return 'https://media.discordapp.net/' + asset.slice(3);
      }
      if (asset.startsWith('https://') || asset.startsWith('http://')) return asset;
      if (asset.startsWith('spotify:')) {
        return 'https://i.scdn.co/image/' + asset.slice('spotify:'.length);
      }
      if (applicationId) {
        return `https://cdn.discordapp.com/app-assets/${applicationId}/${asset}.png`;
      }
      return null;
    }

    function formatElapsed(startMs, suffix = 'elapsed') {
      const elapsed = Date.now() - startMs;
      if (elapsed < 0) return `0:00 ${suffix}`;
      const total = Math.floor(elapsed / 1000);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')} ${suffix}`;
      return `${m}:${s.toString().padStart(2,'0')} ${suffix}`;
    }

    function renderActivityCard(activity) {
      const typeInfo = ACTIVITY_TYPES[activity.type] || { label: 'Activity', icon: 'fa-circle' };
      const largeImg = activity.assets?.large_image
        ? resolveAssetUrl(activity.application_id, activity.assets.large_image)
        : null;
      const smallImg = activity.assets?.small_image
        ? resolveAssetUrl(activity.application_id, activity.assets.small_image)
        : null;

      let imgBlock = '';
      if (largeImg) {
        imgBlock = `
          <div class="activity-img-wrap">
            <img class="activity-img" src="${largeImg}" alt="${escapeHtml(activity.assets?.large_text || activity.name || '')}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
            <div class="activity-img-placeholder" style="display:none;"><i class="fa-solid ${typeInfo.icon}"></i></div>
            ${smallImg ? `<img class="activity-img-small" src="${smallImg}" alt="${escapeHtml(activity.assets?.small_text || '')}" loading="lazy" />` : ''}
          </div>
        `;
      }

      const name = escapeHtml(activity.name || 'Unknown Activity');
      const details = activity.details ? `<div class="activity-detail">${escapeHtml(activity.details)}</div>` : '';
      const state = activity.state ? `<div class="activity-state">${escapeHtml(activity.state)}</div>` : '';

      let timeBlock = '';
      const start = activity.timestamps?.start;
      const end = activity.timestamps?.end;
      if (start && !end) {
        timeBlock = `<div class="activity-time" data-start="${start}">
          <span style="width:6px; height:6px; border-radius:50%; background: var(--status-online); display:inline-block; margin-right: 4px;"></span>
          <span>${formatElapsed(start)}</span>
        </div>`;
      } else if (start && end) {
        const now = Date.now();
        const total = end - start;
        const elapsed = Math.min(Math.max(now - start, 0), total);
        timeBlock = `<div class="activity-time" data-start="${start}" data-end="${end}">
          <i class="fa-regular fa-clock" style="margin-right: 4px;"></i>
          <span>${formatTime(elapsed)} / ${formatTime(total)}</span>
        </div>`;
      }

      let buttonsBlock = '';
      if (Array.isArray(activity.buttons) && activity.buttons.length > 0) {
        buttonsBlock = `<div class="activity-buttons">${activity.buttons.map(b => {
          let icon = 'fa-link';
          let url = activity.url || '#';
          if (b.toLowerCase().includes('youtube')) {
            icon = 'fa-youtube';
            url = activity.url || 'https://www.youtube.com';
          }
          return `<a class="activity-btn" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands ${icon}"></i> ${escapeHtml(b)}</a>`;
        }).join('')}</div>`;
      }

      return `
        <div class="activity-item" data-activity-id="${escapeHtml(activity.id || '')}">
          ${imgBlock}
          <div class="activity-content" style="${largeImg ? '' : 'width: 100%;'}">
            <div class="activity-type-badge"><i class="fa-solid ${typeInfo.icon}"></i> ${typeInfo.label}</div>
            <div class="activity-name">${name}</div>
            ${details}
            ${state}
            ${timeBlock}
            ${buttonsBlock}
          </div>
        </div>
      `;
    }

    function renderActivities(activities) {
      // Filter out Spotify (handled by its own widget) AND Custom Status (Type 4) completely
      const filtered = (activities || []).filter(a => {
        if (a.type === 2 && (a.name === 'Spotify' || a.name === 'spotify')) return false;
        if (a.type === 4) return false; 
        return true;
      });

      if (filtered.length === 0) {
        currentActivities = [];
        els.activityWrap.innerHTML = `
          <div class="activity-empty">
            <i class="fa-solid fa-gamepad"></i>
            <span>Not playing anything right now</span>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(a => { html += renderActivityCard(a); });

      els.activityWrap.innerHTML = html;

      currentActivities = filtered
        .filter(a => a.timestamps?.start)
        .map(a => ({ id: a.id, start: a.timestamps.start, end: a.timestamps?.end || null }));
    }

    function startActivityTicker() {
      if (activityTickTimer) return;
      activityTickTimer = setInterval(() => {
        if (!currentActivities.length) return;
        currentActivities.forEach(act => {
          const cards = els.activityWrap.querySelectorAll(`.activity-item[data-activity-id="${act.id}"] .activity-time span:last-child`);
          cards.forEach(node => {
            if (act.end) {
              const now = Date.now();
              const total = act.end - act.start;
              const elapsed = Math.min(Math.max(now - act.start, 0), total);
              node.textContent = `${formatTime(elapsed)} / ${formatTime(total)}`;
            } else {
              node.textContent = formatElapsed(act.start);
            }
          });
        });
      }, 1000);
    }

    function stopActivityTicker() {
      if (activityTickTimer) { clearInterval(activityTickTimer); activityTickTimer = null; }
    }

    // ---------- DATA HANDLER ----------
    function handlePresence(data) {
      if (!data) return;
      updateDiscordStatus(data.discord_status);
      if (data.listening_to_spotify && data.spotify) {
        applySpotifyData(data.spotify);
      } else {
        showEmptyState();
      }
      renderActivities(data.activities);
      startActivityTicker();
    }

    // ---------- WEBSOCKET ----------
    function connectWS() {
      try { ws = new WebSocket(WS_URL); }
      catch (e) {
        console.warn('[Lanyard] WebSocket init failed, falling back to polling.');
        startPolling(); return;
      }

      ws.onopen = () => {
        usingWebSocket = true;
        reconnectAttempts = 0;
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.op === 1) {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            const interval = msg.d?.heartbeat_interval || 30000;
            heartbeatTimer = setInterval(() => {
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ op: 3 }));
              }
            }, interval);
            ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
          } else if (msg.op === 0) {
            handlePresence(msg.d);
          }
        } catch (e) {
          console.warn('[Lanyard] Bad WS message:', e);
        }
      };

      ws.onerror = () => {};
      ws.onclose = () => {
        usingWebSocket = false;
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
        startPolling();
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectAttempts++;
      const delay = Math.min(
        RECONNECT_BASE_MS * Math.pow(1.5, reconnectAttempts),
        RECONNECT_MAX_MS
      );
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectWS();
      }, delay);
    }

    // ---------- HTTP POLLING FALLBACK ----------
    async function fetchOnce() {
      try {
        const res = await fetch(HTTP_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (json && json.success && json.data) handlePresence(json.data);
      } catch (e) {
        console.warn('[Lanyard] polling fetch failed:', e.message);
      }
    }
    function startPolling() {
      if (pollTimer) return;
      fetchOnce();
      pollTimer = setInterval(fetchOnce, POLL_INTERVAL_MS);
    }
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    // ---------- LIFECYCLE ----------
    function init() {
      connectWS();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (progressRaf && !reducedMotion) {
            cancelAnimationFrame(progressRaf); progressRaf = null;
          }
        } else if (currentSpotify && !progressRaf) {
          startProgress();
        }
      });
      window.addEventListener('beforeunload', () => {
        if (ws) ws.close();
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        if (pollTimer) clearInterval(pollTimer);
        if (reconnectTimer) clearTimeout(reconnectTimer);
        if (activityTickTimer) clearInterval(activityTickTimer);
        stopProgress();
      });
    }

    return { init };
  })();

  document.addEventListener('DOMContentLoaded', LanyardWidget.init);
</script>
</body>
