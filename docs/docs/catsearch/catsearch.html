<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Search 🍁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        'canada-red': '#D52B1E',
                        'canada-light': '#FFEFEF',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8 bg-gradient-to-b from-red-50 to-white dark:from-gray-900 dark:to-black theme-transition text-gray-800 dark:text-gray-100 relative overflow-hidden">

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-gray-800 shadow-md border border-red-100 dark:border-gray-700 z-50 hover:scale-110 transition-transform">
        <svg id="sun-icon" class="w-5 h-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
        </svg>
        <svg id="moon-icon" class="w-5 h-5 block dark:hidden text-canada-red" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <div id="home-view" class="w-full max-w-lg flex flex-col gap-6 flex-grow justify-center relative z-10">
        <div class="flex flex-col items-center gap-2">
            <h1 class="text-3xl font-extrabold tracking-tight flex items-center gap-2">
                Cat Search 
                <span class="text-canada-red text-2xl">
                    <!-- Minimal Maple Leaf SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l1.5 5.5L19 6l-3 4.5 5 1.5-4.5 3 1.5 5.5L12 17l-6 3.5 1.5-5.5L3 12l5-1.5L5 6l5.5 1.5z"/>
                    </svg>
                </span>
            </h1>
            <p class="text-xs uppercase tracking-[0.3em] text-gray-400 dark:text-gray-500">Meow Meow Meow!</p>
        </div>
        
        <!-- Home Comment Bubble -->
        <div class="theme-transition bg-white dark:bg-gray-800 rounded-3xl p-6 sleek-shadow border border-red-50 dark:border-gray-700 flex gap-4 items-start w-full">
            <div class="w-16 h-16 bg-red-50 rounded-full overflow-hidden flex-shrink-0 border-4 border-white dark:border-gray-700 shadow-sm">
              <img src="https://i.pinimg.com/736x/19/69/7e/19697e36c0b08680a24a668930f49d3b.jpg" alt="Profile" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col flex-grow">
                <h2 class="text-lg font-bold text-gray-800 dark:text-gray-100">Su ZhyZai</h2>
                <p class="text-xs text-canada-red font-bold mb-2">Best Friend</p>
                <p class="text-sm text-gray-600 dark:text-gray-300 italic leading-relaxed">"Meow kitties are cooler and cuter"</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div id="search-container" class="theme-transition bg-white dark:bg-gray-800 rounded-full p-2 flex items-center justify-between border border-red-100 dark:border-gray-700 sleek-shadow mt-auto md:mt-4 w-full">
            <input type="text" id="search-input" placeholder="Type kitty, cat, or meow..." class="bg-transparent text-gray-700 dark:text-gray-200 text-sm ml-4 w-full outline-none placeholder:text-gray-400 dark:placeholder:text-gray-500">
            <button id="search-btn" class="bg-canada-red hover:bg-red-700 active:scale-95 transition-all w-12 h-12 rounded-full flex items-center justify-center shadow-md flex-shrink-0 text-white">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
        <p id="error-text" class="text-xs text-canada-red text-center h-4 font-bold"></p>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay" class="fixed inset-0 bg-black/30 dark:bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="theme-transition bg-white dark:bg-gray-800 w-full max-w-sm rounded-3xl p-5 sleek-shadow relative fade-in flex flex-col border border-red-50 dark:border-gray-700">
            <!-- Close Button -->
            <button id="close-btn" class="absolute -top-3 -right-3 bg-white dark:bg-gray-700 w-10 h-10 rounded-full shadow-lg flex items-center justify-center text-gray-400 dark:text-gray-300 hover:text-canada-red border border-gray-100 dark:border-gray-600 z-10 transition-transform hover:scale-110">
                &times;
            </button>
            
            <!-- Result Image -->
            <div class="w-full aspect-square bg-red-50 dark:bg-gray-700 rounded-2xl overflow-hidden mb-4 border border-red-50 dark:border-gray-700 relative">
                <img id="cat-image" src="" alt="Cat result" class="w-full h-full object-cover">
                <!-- Skeleton Loader -->
                <div id="img-loader" class="absolute inset-0 bg-red-50 dark:bg-gray-700 animate-pulse flex items-center justify-center">
                    <svg class="w-10 h-10 text-red-200 dark:text-gray-500 animate-bounce" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l1.5 5.5L19 6l-3 4.5 5 1.5-4.5 3 1.5 5.5L12 17l-6 3.5 1.5-5.5L3 12l5-1.5L5 6l5.5 1.5z"/>
                    </svg>
                </div>
            </div>

            <!-- Result Comment -->
            <div class="flex gap-3 items-center">
                <div class="w-12 h-12 bg-red-50 rounded-full overflow-hidden flex-shrink-0 border-2 border-white dark:border-gray-700 shadow-sm">
                 <img src="https://i.pinimg.com/736x/19/69/7e/19697e36c0b08680a24a668930f49d3b.jpg" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-800 dark:text-gray-100">Su ZhyZai</h3>
                    <p id="comment-text" class="text-sm text-gray-600 dark:text-gray-300 mt-1">Cute cat found!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
