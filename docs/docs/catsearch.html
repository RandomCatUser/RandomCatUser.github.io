<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { font-family: 'JetBrains Mono', monospace; }
        
        /* Smooth transitions for dark mode */
        body, .theme-transition {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .dark .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        /* Shake animation for invalid input */
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        html, body { height: 100%; }

        /* Custom cursors */
        html, body {
            cursor: url("./assets/cursor/cursor.svg") 16 16, auto;
        }
        a, button, [role="button"], #search-btn, #close-btn, #theme-toggle {
            cursor: url("./assets/cursor/pointinghand.svg") 0 0, pointer;
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8 bg-gradient-to-b from-orange-50 to-gray-50 dark:from-gray-900 dark:to-gray-800 theme-transition text-gray-800 dark:text-gray-100 relative overflow-hidden">

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-gray-800 shadow-md border border-gray-100 dark:border-gray-700 z-50 hover:scale-110 transition-transform">
        <svg id="sun-icon" class="w-5 h-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
        </svg>
        <svg id="moon-icon" class="w-5 h-5 block dark:hidden text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <div id="home-view" class="w-full max-w-lg flex flex-col gap-4 flex-grow justify-center relative z-10">
        <h1 class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest text-center mb-2">Cat Search</h1>
        
        <!-- Home Comment Bubble -->
        <div class="theme-transition bg-white dark:bg-gray-800 rounded-3xl p-6 card-shadow border border-gray-100 dark:border-gray-700 flex gap-4 items-start w-full">
            <div class="w-14 h-14 bg-pink-100 rounded-full overflow-hidden flex-shrink-0 flex items-center justify-center text-2xl border-2 border-white dark:border-gray-800 shadow-inner">
              <img src="https://i.pinimg.com/736x/19/69/7e/19697e36c0b08680a24a668930f49d3b.jpg" alt="Profile" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col flex-grow">
                <h2 class="text-sm font-bold text-gray-800 dark:text-gray-100">Su ZhyZai <3</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400">Best Friend</p>
                <p class="text-xs text-gray-600 dark:text-gray-300 mt-2 italic">There is millions of cats who is cuter than Dihan but he is the coolest.</p>
            </div>
        </div>

        <!-- Search Bar pinned near bottom -->
        <div id="search-container" class="theme-transition bg-white dark:bg-gray-800 rounded-full p-2 flex items-center justify-between border border-gray-200 dark:border-gray-700 card-shadow mt-auto md:mt-4 w-full">
            <input type="text" id="search-input" placeholder="Type kitty, cat, or meow..." class="bg-transparent text-gray-600 dark:text-gray-200 text-sm ml-4 font-bold w-full outline-none placeholder:text-gray-400 dark:placeholder:text-gray-500">
            <button id="search-btn" class="bg-[#FFCCAA] hover:bg-[#ffb985] active:scale-95 transition-all w-12 h-12 rounded-full flex items-center justify-center shadow-md flex-shrink-0 text-white">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
        <p id="error-text" class="text-xs text-red-500 text-center h-4 font-bold"></p>
    </div>

    <div id="result-overlay" class="fixed inset-0 bg-black/40 dark:bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="theme-transition bg-white dark:bg-gray-800 w-full max-w-sm rounded-3xl p-4 card-shadow relative fade-in flex flex-col">
            <!-- Close Button -->
            <button id="close-btn" class="absolute -top-3 -right-3 bg-white dark:bg-gray-700 w-10 h-10 rounded-full shadow-lg flex items-center justify-center text-gray-500 dark:text-gray-300 hover:text-red-500 border border-gray-100 dark:border-gray-600 z-10 transition-transform hover:scale-105">
                &times;
            </button>
            
            <!-- Result Image -->
            <div class="w-full aspect-square bg-gray-100 dark:bg-gray-700 rounded-2xl overflow-hidden mb-4 border border-gray-100 dark:border-gray-700 relative">
                <img id="cat-image" src="" alt="Cat result" class="w-full h-full object-cover">
                <!-- Skeleton Loader -->
                <div id="img-loader" class="absolute inset-0 bg-gray-200 dark:bg-gray-700 animate-pulse hidden"></div>
            </div>

            <!-- Result Comment -->
            <div class="flex gap-3 items-center">
                <div class="w-10 h-10 bg-pink-100 rounded-full overflow-hidden flex-shrink-0 flex items-center justify-center text-lg border-2 border-white dark:border-gray-800 shadow-inner">
                 <img src="https://i.pinimg.com/736x/19/69/7e/19697e36c0b08680a24a668930f49d3b.jpg" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-800 dark:text-gray-100">Su ZhyZai <3</h3>
                    <p id="comment-text" class="text-xs text-gray-600 dark:text-gray-300">Cute cat found!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Dark Mode Logic ---
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Apply saved theme on load
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // --- App Logic ---
        const resultOverlay = document.getElementById('result-overlay');
        const catImage = document.getElementById('cat-image');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const closeBtn = document.getElementById('close-btn');
        const commentText = document.getElementById('comment-text');
        const errorText = document.getElementById('error-text');
        const searchContainer = document.getElementById('search-container');
        const imgLoader = document.getElementById('img-loader');

        const comments = [
            "Look at this fluff! Absolutely purr-fect.",
            "My favorite kind of friend.",
            "This one is definitely stealing the spotlight today!",
            "Too cute to handle, isn't it?",
            "Warning: Extreme cuteness ahead."
        ];

        const validSearches = ['kitty', 'cat', 'meow'];

        function triggerError(message) {
            errorText.textContent = message;
            searchContainer.classList.remove('shake');
            void searchContainer.offsetWidth; // trigger reflow to restart animation
            searchContainer.classList.add('shake');
            
            setTimeout(() => {
                errorText.textContent = '';
            }, 3000);
        }

        async function fetchCat(retryCount = 0) {
            const MAX_RETRIES = 3;
            
            // Set loading state
            searchBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
            searchInput.disabled = true;
            resultOverlay.classList.remove('hidden');
            resultOverlay.classList.add('flex');
            imgLoader.classList.remove('hidden');
            catImage.style.opacity = '0';

            try {
                const response = await fetch('https://api.thecatapi.com/v1/images/search');
                if (!response.ok) throw new Error('API error');
                
                const data = await response.json();
                
                catImage.src = data[0].url;
                catImage.onload = () => {
                    imgLoader.classList.add('hidden');
                    catImage.style.opacity = '1';
                    
                    // Reset UI
                    searchBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
                    searchInput.disabled = false;
                    searchInput.value = '';
                    
                    // Show result
                    commentText.textContent = comments[Math.floor(Math.random() * comments.length)];
                };
            } catch (error) {
                if (retryCount < MAX_RETRIES) {
                    setTimeout(() => fetchCat(retryCount + 1), 1000);
                } else {
                    imgLoader.classList.add('hidden');
                    searchBtn.innerHTML = '❌';
                    searchInput.disabled = false;
                    commentText.textContent = "Cats are hiding! Try again later.";
                }
            }
        }

        function handleSearch() {
            const query = searchInput.value.toLowerCase().trim();
            if (query === '') {
                triggerError("Please type something!");
            } else if (validSearches.includes(query)) {
                fetchCat();
            } else {
                triggerError("Please type 'kitty', 'cat', or 'meow'.");
            }
        }

        // Event Listeners
        searchBtn.addEventListener('click', handleSearch);

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        closeBtn.addEventListener('click', () => {
            resultOverlay.classList.add('hidden');
            resultOverlay.classList.remove('flex');
        });

        // Close overlay if clicking outside the card
        resultOverlay.addEventListener('click', (e) => {
            if (e.target === resultOverlay) {
                resultOverlay.classList.add('hidden');
                resultOverlay.classList.remove('flex');
            }
        });

    </script>
</body>
</html>
